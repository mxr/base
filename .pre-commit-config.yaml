repos:
- repo: https://github.com/biomejs/pre-commit
  rev: 3e8b293b5e343b39246e76fed741691f0206b3d4  # frozen: v2.5.8
  hooks:
  - id: biome-check
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
    args: [--assume-in-merge]
  - id: end-of-file-fixer
  - id: pretty-format-json
    args: [--autofix]
    exclude: package-lock.json
  - id: trailing-whitespace
- repo: https://github.com/pre-commit/sync-pre-commit-deps
  rev: 497f8ebf9d58162bb5898e3973a633d31d511169  # frozen: v0.0.5
  hooks:
  - id: sync-pre-commit-deps
    args: [--yaml-mapping=2, --yaml-sequence=2, --yaml-offset=0]
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies: [github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest]
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
  hooks:
  - id: shellcheck
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
- repo: local
  hooks:
  - id: biome-migrate
    name: biome migrate
    entry: biome migrate --write
    language: node
    additional_dependencies: ['@biomejs/biome@2.5.8']
    files: ^\.pre-commit-config\.yaml$
    pass_filenames: false
