name: main

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  main:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v0.0.0
      with:
        persist-credentials: false
    - run: sudo apt-get update && sudo apt-get install -y bats zsh
    - run: bats tests/
