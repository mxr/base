name: main
on:
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}
permissions: {}
jobs:
  main:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v0.0.0
      with:
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@v0.0.0
      with:
        node-version-file: package.json
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Test
      run: npm test
    - name: Package
      run: npm run package
    - name: Upload artifact
      uses: actions/upload-artifact@v0.0.0
      with:
        name: build-artifact
        path: dist
        overwrite: true
