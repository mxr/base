_min_copier_version: 9.0.0
_subdirectory: template

_jinja_extensions:
- extensions:DetectStack

_exclude:
- "{% if 'frontend' not in stack %}biome.json{% endif %}"
- "{% if 'python' not in stack %}.github/workflows/main.yml{% endif %}"
- "{% if 'python' not in stack %}.github/workflows/release.yml{% endif %}"

_tasks:
- command: sh -c 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && uvx pre-commit autoupdate --freeze || true'
  working_directory: '{{ _copier_conf.dst_path }}'
# seed .pre-commit-config.yaml's own additional_dependencies via sync-typing-deps
# before the real run below, otherwise ty/mypy fail with no deps on a fresh
# render since they'd otherwise run before sync-typing-deps ever touches the file
- command: sh -c 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && uvx pre-commit run --files .pre-commit-config.yaml || true'
  working_directory: '{{ _copier_conf.dst_path }}'
# unlike the tasks above, let this one actually fail the render: a broken
# .pre-commit-config.yaml shouldn't get silently committed downstream
- command: sh -c 'if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then uvx pre-commit run --all-files; fi'
  working_directory: '{{ _copier_conf.dst_path }}'

stack:
  type: str
  multiselect: true
  choices: [frontend, github-actions, json, python, rust, shell, sql, toml]
  default: '{{ _stack_detected }}'
