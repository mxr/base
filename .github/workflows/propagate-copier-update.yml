name: propagate copier update

on:
  push:
    tags: [v*]

permissions: {}

jobs:
  propagate:
    runs-on: ubuntu-24.04
    steps:
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        # https://docs.zizmor.sh/audits/#remediation_5
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      id: app-token
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write

    - name: update downstream repos
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"

        # copier internally re-clones the template repo (and any repo it needs to
        # inspect) with plain git, so private repos need credentials wired globally
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

        repos=$(gh api /installation/repositories --paginate \
          --jq '.repositories[] | select(.fork == false and .archived == false) | .full_name')

        for repo in $repos; do
          echo "::group::${repo}"
          workdir="$(mktemp -d)"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$workdir"

          git -C "$workdir" config user.name "mxr-base-copier-sync[bot]"
          git -C "$workdir" config user.email "4334921+mxr-base-copier-sync[bot]@users.noreply.github.com"

          if [ -f "$workdir/.copier-answers.yml" ]; then
            action="update"
            branch="copier-update-${tag}"
            pr_title="[copier] update to ${tag}"
            pr_body="Automated update from base template ${tag}."
          else
            action="onboard"
            branch="copier-onboard-${tag}"
            pr_title="[copier] onboard to ${tag}"
            pr_body="Automated onboarding onto base template ${tag}."
          fi

          git -C "$workdir" checkout -b "$branch"

          if [ "$action" = "update" ]; then
            (cd "$workdir" && uvx --with copier-template-extensions --with "git+https://github.com/mxr/base.git@${tag}" copier update --trust --defaults --vcs-ref "$tag")
          else
            (cd "$workdir" && uvx --with copier-template-extensions --with "git+https://github.com/mxr/base.git@${tag}" copier copy --trust --defaults --overwrite --vcs-ref "$tag" https://github.com/mxr/base.git .)
          fi

          if git -C "$workdir" diff --quiet && git -C "$workdir" diff --cached --quiet; then
            echo "no changes"
            echo "::endgroup::"
            continue
          fi

          git -C "$workdir" add -A
          git -C "$workdir" commit -m "[copier] ${action} to ${tag}"
          git -C "$workdir" push -u origin "$branch"

          gh pr create \
            --repo "${repo}" \
            --title "$pr_title" \
            --body "$pr_body" \
            --head "$branch" || true

          echo "::endgroup::"
        done
