name: propagate copier update

on:
  push:
    tags: [v*]

permissions: {}

jobs:
  propagate:
    runs-on: ubuntu-24.04
    steps:
    - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      with:
        enable-cache: false

    - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      id: app-token
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write

    - name: update downstream repos
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"

        # copier internally re-clones the template repo (and any repo it needs to
        # inspect) with plain git, so private repos need credentials wired globally
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

        repos=$(gh api /installation/repositories --paginate \
          --jq '.repositories[] | select(.fork == false and .archived == false) | .full_name')

        for repo in $repos; do
          echo "::group::${repo}"
          workdir="$(mktemp -d)"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$workdir"

          if [ ! -f "$workdir/.copier-answers.yml" ]; then
            echo "not templated, skip"
            echo "::endgroup::"
            continue
          fi

          git -C "$workdir" config user.name "mxr-base-copier-sync[bot]"
          git -C "$workdir" config user.email "4334921+mxr-base-copier-sync[bot]@users.noreply.github.com"

          branch="copier-update-${tag}"
          git -C "$workdir" checkout -b "$branch"

          (cd "$workdir" && uvx --with copier-template-extensions --with "git+https://github.com/mxr/base.git@${tag}" copier update --trust --defaults --vcs-ref "$tag")

          if git -C "$workdir" diff --quiet && git -C "$workdir" diff --cached --quiet; then
            echo "no changes"
            echo "::endgroup::"
            continue
          fi

          git -C "$workdir" add -A
          git -C "$workdir" commit -m "chore: copier update to ${tag}"
          git -C "$workdir" push -u origin "$branch"

          gh pr create \
            --repo "${repo}" \
            --title "[copier] update to ${tag}" \
            --body "Automated update from base template ${tag}." \
            --head "$branch" || true

          echo "::endgroup::"
        done
