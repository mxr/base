name: propagate copier update

on:
  push:
    tags: [v*]

permissions: {}

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      id: app-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: mxr # zizmor: ignore[github-app] read-only, used only to enumerate installed repos; no write perms granted here
        permission-metadata: read

    - id: list
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        # TEMP: restricted to dotfiles/base only for this run, revert to the full installation-repositories query before real rollout
        echo 'repos=["dotfiles", "base"]' >> "$GITHUB_OUTPUT"

  propagate:
    needs: list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.list.outputs.repos) }}
    steps:
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        # https://docs.zizmor.sh/audits/#remediation_5
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      id: app-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: mxr
        # base itself is needed too: copier clones it to fetch the template + extensions package
        repositories: ${{ matrix.repo }},base
        permission-contents: write
        permission-pull-requests: write

    - name: update downstream repo
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        REPO: mxr/${{ matrix.repo }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"

        # copier internally re-clones the template repo (and any repo it needs to
        # inspect) with plain git, so private repos need credentials wired globally
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

        workdir="$(mktemp -d)"
        git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$workdir"

        git -C "$workdir" config user.name "mxr-base-copier-sync[bot]"
        git -C "$workdir" config user.email "4334921+mxr-base-copier-sync[bot]@users.noreply.github.com"

        if [ -f "$workdir/.copier-answers.yml" ]; then
          action="update"
          branch="copier-update"
          pr_title="[copier] update to ${tag}"
          pr_body="Automated update from base template ${tag}."
        else
          action="onboard"
          branch="copier-onboard-${tag}"
          pr_title="[copier] onboard to ${tag}"
          pr_body="Automated onboarding onto base template ${tag}."
        fi

        # reuse an already-open copier-update PR's branch instead of opening a new
        # one every release, so downstream repos don't accumulate stale PRs
        if [ "$action" = "update" ] && git -C "$workdir" ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
          git -C "$workdir" fetch --quiet origin "$branch"
          git -C "$workdir" checkout -b "$branch" "origin/$branch"
        else
          git -C "$workdir" checkout -b "$branch"
        fi

        if [ "$action" = "update" ]; then
          (cd "$workdir" && uvx --with copier-template-extensions --with "git+https://github.com/mxr/base.git@${tag}" copier update --trust --defaults --vcs-ref "$tag")
        else
          (cd "$workdir" && uvx --with copier-template-extensions --with "git+https://github.com/mxr/base.git@${tag}" copier copy --trust --defaults --overwrite --vcs-ref "$tag" https://github.com/mxr/base.git .)
        fi

        if git -C "$workdir" diff --quiet && git -C "$workdir" diff --cached --quiet; then
          echo "no changes"
          exit 0
        fi

        git -C "$workdir" add -A
        git -C "$workdir" commit -m "[copier] ${action} to ${tag}"
        git -C "$workdir" push -u origin "$branch"

        existing_pr="$(gh pr list --repo "${REPO}" --head "$branch" --json number -q '.[0].number' || true)"
        if [ -n "$existing_pr" ]; then
          gh pr edit "$existing_pr" --repo "${REPO}" --title "$pr_title" --body "$pr_body"
        else
          gh pr create \
            --repo "${REPO}" \
            --title "$pr_title" \
            --body "$pr_body" \
            --head "$branch" || true
        fi
