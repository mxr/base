# ~~ Generated by projen in mxr/base. Modifications will be overwritten on the next sync. To modify properly, edit .github/base.yml and retrigger the propagate workflow in mxr/base.

name: main
on:
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}
permissions: {}
jobs:
  main:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Test
      run: npm test
    - name: Package
      run: npm run package
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-artifact
        path: dist
        overwrite: true

  bats:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=bats-core/bats-core extractVersion=^v(?<version>.+)$
      BATS_VERSION: 1.14.0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
      with:
        bats-version: ${{ env.BATS_VERSION }}
    - run: sudo apt-get update && sudo apt-get install -y zsh
    - run: git ls-files -z '*.bats' | xargs -0 bats
