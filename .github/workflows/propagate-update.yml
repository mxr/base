name: propagate update

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (print the diff per repo, skip push/PR)
        type: boolean
        default: true

permissions: {}

env:
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: 4.7.0
  # renovate: datasource=pypi depName=pre-commit-uv
  PRE_COMMIT_UV_VERSION: 4.4.0
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.13.6

jobs:
  build:
    if: github.event_name == 'push'
    uses: $/.github/workflows/main.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        registry-url: https://npm.pkg.github.com
        scope: '@mxr'
        package-manager-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-artifact
        path: dist
    - run: npm publish dist/js/*.tgz # zizmor: ignore[use-trusted-publishing] GitHub Packages npm registry doesn't support OIDC trusted publishing
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  list:
    runs-on: ubuntu-26.04
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: mxr # zizmor: ignore[github-app] read-only, used only to enumerate installed repos and check for .github/base.yml; no write perms granted here
        permission-metadata: read
        permission-contents: read

    - id: list
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        has_base_yml() {
          if gh api "repos/mxr/$1/contents/.github/base.yml" > /dev/null 2>&1; then
            echo "$1"
          fi
        }
        export -f has_base_yml
        matched="$(gh api /installation/repositories --paginate --jq '.repositories[] | select(.archived | not) | .name' | xargs -P 8 -I{} bash -c 'has_base_yml {}' | sort | jq -R . | jq -sc .)"
        echo "repos=$matched" >> "$GITHUB_OUTPUT"

  propagate:
    needs: [list, publish]
    if: always() && needs.list.result == 'success' && (github.event_name != 'push' || needs.publish.result == 'success')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.list.outputs.repos) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        package-manager-cache: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: false
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: mxr
        repositories: ${{ matrix.repo }}
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write

    # fetches base.yml once, then installs pinact and pre-commit concurrently
    - name: install tools
      id: tools
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_TOKEN: ${{ github.token }}
        REPO: mxr/${{ matrix.repo }}
      run: |
        set -euo pipefail
        base_yml="$(GH_TOKEN="$APP_TOKEN" gh api "repos/${REPO}/contents/.github/base.yml" --jq '.content' | base64 -d)"
        # keys the pre-commit cache below; a repo without a config yet hashes the empty string
        pre_commit_config="$(GH_TOKEN="$APP_TOKEN" gh api "repos/${REPO}/contents/.pre-commit-config.yaml" --jq '.content' 2>/dev/null | base64 -d || true)"
        echo "pre-commit-config-hash=$(sha256sum <<< "$pre_commit_config" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        # home assistant packaging omits min-version. Keep in sync with HOME_ASSISTANT_PYTHON in src/python.ts
        if [ "$(yq '.opt.python.packaging // ""' - <<< "$base_yml")" = "home-assistant" ]; then
          python_version="3.14"
        else
          python_version="$(yq '.opt.python.min-version // ""' - <<< "$base_yml")"
        fi
        # same condition as BaseProject's for running pinact: Stack.RUST,
        # Stack.FRONTEND, Stack.MIRROR, or Stack.PYTHON with opt.python.ci (on by
        # default), opt.python.packaging, or opt.python.runTypeChecksInGithubActions set
        needs_pinact="$(yq '((.stack // []) | (contains(["rust"]) or contains(["frontend"]) or contains(["mirror"]))) or (((.stack // []) | contains(["python"])) and ((.opt.python.ci != false) or (.opt.python.packaging != null) or (.opt.python.run-type-checks-in-github-actions == true)))' - <<< "$base_yml")"

        install_pinact() {
          dir="$RUNNER_TEMP/pinact"
          mkdir -p "$dir"
          gh release download --repo suzuki-shunsuke/pinact --pattern 'pinact_linux_amd64.tar.gz' --dir "$dir"
          gh attestation verify "$dir/pinact_linux_amd64.tar.gz" --repo suzuki-shunsuke/pinact --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar -xzf "$dir/pinact_linux_amd64.tar.gz" -C "$dir" pinact
          echo "$dir" >> "$GITHUB_PATH"
        }

        # BaseProject.postSynthesize(), run by propagate-repo.sh below, calls a
        # plain `pre-commit`. Install it on the repo's Python version, which uv
        # fetches if missing, so default_language_version.python matches
        # pre-commit's interpreter and pre-commit doesn't search PATH for it
        install_pre_commit() {
          # pre-commit-uv installs python hook envs with uv instead of pip
          args=("pre-commit==${PRE_COMMIT_VERSION}" --with "pre-commit-uv==${PRE_COMMIT_UV_VERSION}" --with "uv==${UV_VERSION}")
          if [ -n "$python_version" ]; then
            args+=(--python "$python_version")
          fi
          uv tool install "${args[@]}"
          uv tool dir --bin >> "$GITHUB_PATH"
        }

        pids=()
        install_pre_commit & pids+=($!)
        if [ "$needs_pinact" = "true" ]; then
          install_pinact & pids+=($!)
        fi
        status=0
        for pid in "${pids[@]}"; do
          wait "$pid" || status=1
        done
        exit "$status"

    # keyed on the downstream repo's current config. Synth installs hook envs
    # only for new revs, which become that key's contents once the base-update
    # PR merges. Falls back to the repo's latest cache, then any repo's
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] only hook envs for synthing downstream repos; publish never restores it
      with:
        path: ~/.cache/pre-commit
        key: pre-commit/${{ runner.os }}/${{ matrix.repo }}/${{ steps.tools.outputs.pre-commit-config-hash }}
        restore-keys: |
          pre-commit/${{ runner.os }}/${{ matrix.repo }}/
          pre-commit/${{ runner.os }}/

    - name: update downstream repo
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        # GitHub App installation tokens can't read packages owned by a personal
        # account, only ones owned by an org, so npm registry auth needs a PAT
        GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        REPO: mxr/${{ matrix.repo }}
        # a manual run has nothing new to publish, so it always targets the
        # already-published version in package.json rather than a git ref
        DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run || 'false' }}
      # zizmor: ignore[adhoc-packages] deliberately bumps to a specific new base version, not installable from a lockfile
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="$(jq -r .version package.json)"
        fi
        VERSION="$version" .github/scripts/propagate-repo.sh
