name: propagate update

on:
  push:
    tags: [v*]

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        registry-url: https://npm.pkg.github.com
        scope: '@mxr'
        package-manager-cache: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-artifact
        path: dist
    - run: npm publish dist/js/*.tgz # zizmor: ignore[use-trusted-publishing] GitHub Packages npm registry doesn't support OIDC trusted publishing
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  list:
    needs: publish
    runs-on: ubuntu-24.04
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: mxr # zizmor: ignore[github-app] read-only, used only to enumerate installed repos; no write perms granted here
        permission-metadata: read

    - id: list
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        # TEMP: restricted to dotfiles only for this run, revert to the full installation-repositories query before real rollout
        echo 'repos=["dotfiles"]' >> "$GITHUB_OUTPUT"

  propagate:
    needs: list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.list.outputs.repos) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        enable-cache: false
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: mxr
        repositories: ${{ matrix.repo }}
        permission-contents: write
        permission-pull-requests: write

    - name: update downstream repo
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # GitHub App installation tokens can't read packages owned by a personal
        # account (only orgs), so a PAT is needed just for the npm registry auth
        GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        REPO: mxr/${{ matrix.repo }}
        DRY_RUN: 'false'
      # zizmor: ignore[adhoc-packages] deliberately bumps to a specific new base version, not installable from a lockfile
      run: VERSION="${GITHUB_REF_NAME#v}" .github/scripts/propagate-repo.sh
