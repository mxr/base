name: propagate update

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (print the diff per repo, skip push/PR)
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        registry-url: https://npm.pkg.github.com
        scope: '@mxr'
        package-manager-cache: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-artifact
        path: dist
    - run: npm publish dist/js/*.tgz # zizmor: ignore[use-trusted-publishing] GitHub Packages npm registry doesn't support OIDC trusted publishing
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  list:
    needs: publish
    if: always() && (github.event_name != 'push' || needs.publish.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: mxr # zizmor: ignore[github-app] read-only, used only to enumerate installed repos and check for .github/base.yml; no write perms granted here
        permission-metadata: read
        permission-contents: read

    - id: list
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        matched='[]'
        for repo in $(gh api /installation/repositories --paginate --jq '.repositories[].name'); do
          if gh api "repos/mxr/$repo/contents/.github/base.yml" > /dev/null 2>&1; then
            matched="$(jq -c --arg r "$repo" '. + [$r]' <<< "$matched")"
          fi
        done
        echo "repos=$matched" >> "$GITHUB_OUTPUT"

  propagate:
    needs: list
    if: always() && needs.list.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.list.outputs.repos) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        package-manager-cache: false
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
    - name: install pinact
      # postSynthesize's `pinact run -u` call needs this on PATH; installed
      # via the Go toolchain already on the runner rather than pinned, since
      # it's a build tool, not a workflow dep
      run: go install github.com/suzuki-shunsuke/pinact/v4/cmd/pinact@latest
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: mxr
        repositories: ${{ matrix.repo }}
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write

    - name: update downstream repo
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # GitHub App installation tokens can't read packages owned by a personal
        # account (only orgs), so a PAT is needed just for the npm registry auth
        GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        REPO: mxr/${{ matrix.repo }}
        # a manual run has nothing new to publish, so it always targets the
        # already-published version in package.json rather than a git ref
        DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run || 'false' }}
      # zizmor: ignore[adhoc-packages] deliberately bumps to a specific new base version, not installable from a lockfile
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="$(jq -r .version package.json)"
        fi
        VERSION="$version" .github/scripts/propagate-repo.sh
